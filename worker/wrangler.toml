name = "kim-cup-picks-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Public-facing vars (non-secret) — update these each major cycle.
[vars]
CURRENT_MAJOR = "The Open"
PICKS_FILE_PATH = "src/data/theopen-2026.json"
LOCK_AT = "2026-07-16T05:35:00Z"
GITHUB_OWNER = "nicholasocon-tech"
GITHUB_REPO = "kim-cup-tracker"
# From-address for magic-code emails. kim-cup.com is domain-authenticated in
# SendGrid (DNS CNAMEs), so the mailbox need not exist.
MAIL_FROM = "noreply@kim-cup.com"

# KV namespace — populate `id` after running `wrangler kv namespace create KIMCUP_PICKS`
[[kv_namespaces]]
binding = "KIMCUP_PICKS"
id = "8d7a50662101413dbe2d72dac83ed2f9"

# Cron-fires at lock time. Cron is in UTC. The expression below maps to
# 2026-07-16 05:35 UTC (6:35 AM BST) — first tee at Royal Birkdale.
# Format: minute hour day month weekday
[triggers]
crons = ["35 5 16 7 *"]

# Secrets — set via `wrangler secret put <name>` (never check into the repo):
#   GITHUB_TOKEN     fine-grained PAT, contents:write scope, repo: kim-cup-tracker
#   PARTICIPANTS     JSON string (copy of src/data/participants-2026.json)
#   ADMIN_SECRET     opaque string for the manual lock endpoint
#   AUTH_SECRET      random 32+ char string — HMAC key for session tokens
#   SENDGRID_API_KEY SendGrid key with Mail Send permission
