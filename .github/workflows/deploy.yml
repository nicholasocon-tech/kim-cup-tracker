name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The auto-snapshot workflow commits season-2026.json with the default
  # GITHUB_TOKEN, and GitHub deliberately does NOT fire the push event above
  # for token-authored commits (recursion guard). Without this, a freshly
  # snapshotted major lands on main but never reaches the live site. Redeploy
  # whenever the snapshot workflow finishes.
  workflow_run:
    workflows: ["Auto-snapshot completed majors"]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # On a workflow_run trigger, only deploy when the snapshot actually
    # succeeded (workflow_run fires on completion regardless of conclusion).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Writes a CNAME file so GitHub Pages serves at the custom domain.
          cname: kim-cup.com
